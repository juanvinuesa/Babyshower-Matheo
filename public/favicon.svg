<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#fef3c7"/>
  <!-- Wings -->
  <ellipse cx="28" cy="42" rx="18" ry="10" fill="rgba(255,255,255,0.75)" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="72" cy="42" rx="18" ry="10" fill="rgba(255,255,255,0.75)" stroke="#d97706" stroke-width="1.5"/>
  <!-- Body -->
  <ellipse cx="50" cy="66" rx="13" ry="18" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Stripes -->
  <rect x="37" y="59" width="26" height="5" rx="2" fill="#1c1917" opacity="0.8"/>
  <rect x="37" y="68" width="26" height="5" rx="2" fill="#1c1917" opacity="0.8"/>
  <!-- Head -->
  <circle cx="50" cy="44" r="12" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="45" cy="43" r="2.5" fill="#1c1917"/>
  <circle cx="55" cy="43" r="2.5" fill="#1c1917"/>
  <!-- Smile -->
  <path d="M45 49 Q50 53 55 49" stroke="#1c1917" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Antennae -->
  <line x1="46" y1="33" x2="39" y2="20" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="33" x2="61" y2="20" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="39" cy="19" r="4" fill="#d97706"/>
  <circle cx="61" cy="19" r="4" fill="#d97706"/>
  <!-- Stinger -->
  <path d="M47 84 Q50 93 53 84" fill="#d97706"/>
</svg>