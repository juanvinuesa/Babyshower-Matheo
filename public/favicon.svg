<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular celeste -->
  <circle cx="50" cy="50" r="50" fill="#e0f7fa"/>

  <!-- Tetina (nipple) -->
  <ellipse cx="50" cy="28" rx="11" ry="17" fill="#38bdf8"/>
  <ellipse cx="50" cy="22" rx="7" ry="8" fill="#0284c7"/>

  <!-- Escudo / guard -->
  <ellipse cx="50" cy="53" rx="37" ry="22" fill="#bae6fd" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Agujeros del escudo -->
  <ellipse cx="31" cy="53" rx="8" ry="10" fill="#e0f7fa"/>
  <ellipse cx="69" cy="53" rx="8" ry="10" fill="#e0f7fa"/>

  <!-- Tallo del handle -->
  <rect x="45" y="73" width="10" height="8" rx="3" fill="#38bdf8"/>

  <!-- Anillo del handle -->
  <circle cx="50" cy="89" r="9" fill="none" stroke="#38bdf8" stroke-width="6"/>
</svg>