<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular rosa -->
  <circle cx="50" cy="50" r="50" fill="#fce7f3"/>

  <!-- Tetina (nipple) -->
  <ellipse cx="50" cy="28" rx="11" ry="17" fill="#f472b6"/>
  <ellipse cx="50" cy="22" rx="7" ry="8" fill="#ec4899"/>

  <!-- Escudo / guard -->
  <ellipse cx="50" cy="53" rx="37" ry="22" fill="#f9a8d4" stroke="#f472b6" stroke-width="2.5"/>

  <!-- Agujeros del escudo -->
  <ellipse cx="31" cy="53" rx="8" ry="10" fill="#fce7f3"/>
  <ellipse cx="69" cy="53" rx="8" ry="10" fill="#fce7f3"/>

  <!-- Tallo del handle -->
  <rect x="45" y="73" width="10" height="8" rx="3" fill="#f472b6"/>

  <!-- Anillo del handle -->
  <circle cx="50" cy="89" r="9" fill="none" stroke="#f472b6" stroke-width="6"/>
</svg>